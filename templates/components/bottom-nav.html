{% load static %}

{# Mobile: always visible. Desktop: only visible after scrolling past hero. #}
<nav id="bottom-nav-mobile" class="md:hidden fixed bottom-4 left-4 right-4 z-50
         bg-nav backdrop-blur-md border border-nav-border
         rounded-3xl shadow-lg" aria-label="Bottom navigation">
  <div class="flex items-center justify-between px-3 py-2">
    <a href="{% url 'home' %}" class="flex-1 flex flex-col items-center justify-center py-1 rounded-2xl transition-colors
             {% if request.path == '/' %}
               text-sky-500
             {% else %}
               text-muted hover:text-foreground
             {% endif %}">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <span class="mt-0.5 text-[11px] leading-none font-medium">Home</span>
    </a>

    <a href="{% url 'blog' %}" class="flex-1 flex flex-col items-center justify-center py-1 rounded-2xl transition-colors
             {% if request.path == '/blog/' %}
               text-sky-500
             {% else %}
               text-muted hover:text-foreground
             {% endif %}">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" />
      </svg>
      <span class="mt-0.5 text-[11px] leading-none font-medium">Blog</span>
    </a>

    <a href="{% url 'contact' %}" class="flex-1 flex flex-col items-center justify-center py-1 rounded-2xl transition-colors
             {% if request.path == '/contact/' %}
               text-sky-500
             {% else %}
               text-muted hover:text-foreground
             {% endif %}">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
      </svg>
      <span class="mt-0.5 text-[11px] leading-none font-medium">Contact</span>
    </a>
  </div>
</nav>

      </svg>

             {% endif %}">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">

      </svg>
      <span class="mt-0.5 text-[11px] leading-none font-medium">Contact</span>
    </a>
  </div>
</nav>

<script src="{% static 'js/bottom-nav.js' %}"></script>
