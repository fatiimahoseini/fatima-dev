{% if featured_posts %}
<div class="mb-10">
  <div class="flex items-center gap-2 mb-4">
    <span class="text-blue-400 text-xs font-bold uppercase tracking-[0.25em]">
      Featured Post
    </span>
    <div class="w-2 h-2 rounded-full bg-blue-500"></div>
  </div>

  <div class="relative overflow-hidden rounded-2xl border border-border group">
    <div id="slider" class="relative h-[240px] sm:h-[320px] md:h-[420px]">
      {% for post in featured_posts %}
      <div class="slide absolute inset-0 opacity-100 transition-opacity duration-700">
        <img src="{{ post.image.url }}" alt="{{ post.title }}" loading="lazy" class="h-full w-full object-cover" />

        <div class="absolute inset-0 bg-gradient-to-t from-gray-950 via-gray-950/50 to-transparent"></div>

        <a href="{% url 'blog_detail' post.slug %}" class="absolute inset-0" aria-label="Open featured post"></a>

        <div class="absolute bottom-0 w-full p-4 sm:p-6 md:p-8">
          <div class="max-w-xl ml-0 md:ml-4">
            <h1 class="text-xl sm:text-2xl md:text-3xl font-bold text-white mb-5">
              {{ post.title }}
            </h1>

            <div class="hidden md:flex text-slate-300 text-sm flex-col gap-2 mr-4">
              <div class="flex items-center gap-2 mb-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10m-13 9h16a2 2 0 002-2V7a2 2 0 00-2-2H4a2 2 0 00-2 2v11a2 2 0 002 2z" />
                </svg>
                <span>{{ post.published_at|date:"M d, Y" }}</span>
              </div>
              <div class="flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>{{ post.read_time }} min read</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>

    <div id="dots" class="absolute bottom-4 left-1/2 -translate-x-1/2 md:left-6 md:translate-x-0 md:top-1/2 md:-translate-y-1/2 flex flex-row md:flex-col gap-2 z-20"></div>
  </div>
</div>
{% endif %}
