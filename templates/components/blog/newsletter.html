<div
  class="mt-10 bg-surface border border-border rounded-lg p-7 hidden md:block"
>
  <div class="flex flex-col lg:flex-row gap-6 items-center justify-between">
    <div class="flex items-center gap-4">
      <div
        class="w-12 h-12 rounded-lg bg-blue-500 text-white flex items-center justify-center shrink-0"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path
            d="M19 22.5a4.75 4.75 0 0 1 3.5 -3.5a4.75 4.75 0 0 1 -3.5 -3.5a4.75 4.75 0 0 1 -3.5 3.5a4.75 4.75 0 0 1 3.5 3.5"
          />
          <path
            d="M11.5 19h-6.5a2 2 0 0 1 -2 -2v-10a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v5"
          />
          <path d="M3 7l9 6l9 -6" />
        </svg>
      </div>
      <div>
        <h3 class="font-semibold text-lg leading-relaxed">Stay in the loop</h3>
        <p class="text-muted">Get notified when I publish new articles.</p>
      </div>
    </div>

    <form
      action="{% url 'newsletter_subscribe' %}"
      method="POST"
      class="flex w-full lg:w-auto flex-col sm:flex-row overflow-hidden rounded-md border border-border"
    >
      {% csrf_token %}
      <input
        type="email"
        name="email"
        required
        placeholder="Enter your email"
        class="w-full min-w-0 sm:min-w-[280px] bg-transparent px-4 py-3 outline-none border-none flex-1"
      />
      <button
        class="px-5 py-3 bg-blue-600 hover:bg-blue-500 text-white transition"
      >
        Subscribe
      </button>
    </form>
  </div>
</div>
