{% load static %}

<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          if (theme === "light") {
            document.documentElement.classList.remove("dark");
          } else {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Portfolio{% endblock %}</title>
    <link id="favicon" rel="icon" type="image/png" />

    <link rel="stylesheet" href="{% static 'core/css/style.css' %}" />
    <link rel="stylesheet" href="{% static 'blog/css/blog-bg-effects.css' %}" />
    {% block extra_css %}{% endblock %}

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{% static 'js/tailwind-config.js' %}"></script>
  </head>

  <body
    class="bg-background text-foreground font-sans antialiased min-h-screen flex flex-col overflow-x-hidden lg:overflow-x-clip transition-colors duration-200"
  >
    {% include "components/header.html" %}
    {% include "components/bottom-nav.html" %}

    <main
      class="flex-1 min-w-0 overflow-x-hidden lg:overflow-x-clip px-4 sm:px-6 pt-6 pb-24 md:pb-6 flex flex-col {% block main_class %}{% endblock %}"
    >
      {% block content %}{% endblock %}
    </main>

    {% include "components/footer.html" %}

    <script src="{% static 'js/favicon.js' %}"></script>
    <script src="{% static 'js/theme.js' %}"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
